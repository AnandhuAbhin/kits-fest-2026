<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu | VedVora Fest 2026</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Oswald:wght@500;700&display=swap"
        rel="stylesheet">
    <!-- Icons for Mobile Nav -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
</head>

<body>
    <!-- Total Menu Modal (Stand-alone Page) -->
    <div class="total-menu-modal active" id="totalMenuModal">
        <div class="menu-header">
            <div class="menu-logo" style="text-align: center;">
                <img src="assets/5_6107202448462453643.png" alt="Logo"
                    style="width: 100%; filter: drop-shadow(0 0 15px rgba(255, 170, 0, 0.4)); border-radius: 50%;">
            </div>
            <a href="index.html" class="close-menu-btn" style="text-decoration: none;">
                <i class="ri-close-line"></i>
            </a>
        </div>

        <div class="menu-body">
            <a href="index.html" class="menu-card glass-card">
                <div class="menu-icon"><i class="ri-home-5-line"></i></div>
                <div class="menu-text">
                    <h3>Home</h3>
                    <p>Back to main page</p>
                </div>
            </a>

            <a href="https://maps.app.goo.gl/B8QTR6dNpxVJrRnK9?g_st=aw" class="menu-card glass-card" id="menuMapBtn">
                <div class="menu-icon"><i class="ri-map-pin-line"></i></div>
                <div class="menu-text">
                    <h3>Location</h3>
                    <p>Kottayam Institute of Technology and Science</p>
                </div>
            </a>

            <a href="https://drive.google.com/drive/folders/1yIqus8_nhfwcWWbSLGUtHIpJ8RKOSKgA"
                class="menu-card glass-card" id="menuMapBtn">
                <div class="menu-icon"><i class="ri-map-pin-line"></i></div>
                <div class="menu-text">
                    <h3>AutoShow</h3>
                    <p>AutoShow Gallery</p>
                </div>
            </a>

            <a href="index.html#events" class="menu-card glass-card menu-accordion" id="menuEventsBtn">
                <div style="display:flex; align-items:center;">
                    <div class="menu-icon"><i class="ri-calendar-event-line"></i></div>
                    <div class="menu-text">
                        <h3>Events</h3>
                        <p>Browse all events</p>
                    </div>
                </div>
            </a>

            <a href="scorecard.html" class="menu-card glass-card" id="menuAmbassadorBtn">
                <div class="menu-icon"><i class="ri-medal-line"></i></div>
                <div class="menu-text">
                    <h3>Scorecard</h3>
                    <p>Check your rank</p>
                </div>
            </a>

            <a href="scorecard.html#results" class="menu-card glass-card" id="menuAmbassadorBtn">
                <div class="menu-icon"><i class="ri-medal-line"></i></div>
                <div class="menu-text">
                    <h3>Results</h3>
                    <p>Check your results</p>
                </div>
            </a>
        </div>

        <div class="menu-footer">
            <div class="profile-card glass-card">
                <div class="profile-img">
                    <i class="ri-user-3-fill"></i>
                </div>
                <div class="profile-info">
                    <h3>By</h3>
                    <p>Anandhu A</p>
                    <p>CSE 4th Year</p>
                    <div class="social-links">
                        <a href="https://www.instagram.com/a_n_a_n_d_h_u.a" class="hover-target"><i
                                class="ri-instagram-line"></i></a>
                        <a href="https://www.linkedin.com/in/anandhuabhin/" class="hover-target"><i
                                class="ri-linkedin-line"></i></a>

                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
